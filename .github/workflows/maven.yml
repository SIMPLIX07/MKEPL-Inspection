
name: Build Project

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build, test, and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=SIMPLIX07 \
          -Dsonar.projectKey=SIMPLIX07_MKEPL-Inspection

